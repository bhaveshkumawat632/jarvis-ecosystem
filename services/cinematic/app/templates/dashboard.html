<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Junglee Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #4caf50; }
        .service-card { background: #2c2c2c; padding: 15px; margin-bottom: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .status-online { color: #4caf50; font-weight: bold; }
        .status-offline { color: #f44336; font-weight: bold; }
        button { background-color: #008cba; color: white; border: none; padding: 10px 20px; text-align: center; display: inline-block; font-size: 16px; margin: 4px 2px; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #007bb5; }
        .log-area { background: #000; padding: 10px; border-radius: 5px; min-height: 100px; font-family: monospace; overflow-y: auto; color: #0f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Project Junglee - Command Center</h1>
        
        <h2>Service Health</h2>
        <div class="service-card">
            <span>Cinematic API (Port 8001)</span>
            <span class="status-{{ 'online' if cinematic_health == 'Online' else 'offline' }}">{{ cinematic_health }}</span>
        </div>
        <div class="service-card">
            <span>VidRush API (Port 8002)</span>
            <span class="status-{{ 'online' if vidrush_health == 'Online' else 'offline' }}">{{ vidrush_health }}</span>
        </div>
        <div class="service-card">
            <span>AutoClipper Worker (Celery)</span>
            <span class="status-{{ 'online' if 'Online' in autoclipper_health else 'offline' }}">{{ autoclipper_health }}</span>
        </div>

        <h2>Control Panel</h2>
        <button onclick="triggerDummy()">Trigger Dummy Task (Celery)</button>
        
        <h3>System Output</h3>
        <div id="output" class="log-area">System ready...</div>
    </div>

    <script>
        const apiKey = "{{ api_key }}";
        
        async function triggerDummy() {
            const output = document.getElementById("output");
            output.innerHTML += "<br/>> Triggering task...";
            try {
                const response = await fetch(`/api/v1/dashboard/trigger_dummy?api_key=${apiKey}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if(response.ok) {
                    output.innerHTML += `<br/>[SUCCESS] ${data.message}`;
                } else {
                    output.innerHTML += `<br/>[ERROR] ${data.detail}`;
                }
            } catch(e) {
                output.innerHTML += `<br/>[CRITICAL ERROR] ${e}`;
            }
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
